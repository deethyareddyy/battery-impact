<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Battery Impact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Sign In</h1>
  <p>Log in to track your battery impact.</p>

  <div style="display:flex; flex-direction:column; gap:10px; max-width:360px;">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password (6+ chars)" />

    <div style="display:flex; gap:10px;">
      <button id="loginBtn">Login</button>
      <button id="signupBtn">Sign Up</button>
    </div>

    <p id="msg"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script src="firebase.js"></script>

  <script src="auth.js"></script>

</body>
</html>
